name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l main.go internal)"
      - run: make generate-check
      - name: Validate the OpenAPI 3.2 contract
        run: |
          python3 -m venv "$RUNNER_TEMP/openapi-tools"
          "$RUNNER_TEMP/openapi-tools/bin/pip" install -r scripts/requirements-openapi.txt
          "$RUNNER_TEMP/openapi-tools/bin/python" scripts/validate_openapi.py
      - run: go vet ./...
      - run: go test -race ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Install pinned Terraform for docs
        run: |
          python3 tests/acceptance/install_cli.py terraform "$RUNNER_TEMP/cli"
          echo "$RUNNER_TEMP/cli" >> "$GITHUB_PATH"
      - run: make docs-check
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=publish,sign
  acceptance:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, tofu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install pinned Terraform or OpenTofu with checksum verification
        env:
          CLI: ${{ matrix.cli }}
        run: python3 tests/acceptance/install_cli.py "$CLI" "$RUNNER_TEMP/cli"
      - name: Run disposable acceptance suite
        env:
          TF_ACC_TERRAFORM_PATH: ${{ runner.temp }}/cli/${{ matrix.cli }}
        run: python3 tests/acceptance/run.py
