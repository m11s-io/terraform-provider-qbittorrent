Read:
  type: object
  properties:
    resume_data_storage_type:
      x-go-name: ResumeDataStorageType
      x-ui-tab: Advanced
      type: string
      enum: [Legacy, SQLite]
      description: Resume data storage backend. Changing this setting requires a qBittorrent restart.
    torrent_content_remove_option:
      x-go-name: TorrentContentRemoveOption
      x-ui-tab: Advanced
      type: string
      enum: [Delete, MoveToTrash]
      description: Torrent content removal mode.
    memory_working_set_limit:
      x-go-name: MemoryWorkingSetLimit
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -2147483648
      maximum: 2147483647
      description: Physical memory working-set limit in MiB.
    current_network_interface:
      x-go-name: CurrentNetworkInterface
      x-ui-tab: Advanced
      type: string
      description: Network interface name on the qBittorrent server; the API stores the supplied name and resolves its display name when the interface exists on the server.
    current_interface_address:
      x-go-name: CurrentInterfaceAddress
      x-ui-tab: Advanced
      type: string
      description: Optional IP address to bind on the selected server interface.
    current_interface_name:
      x-go-name: CurrentInterfaceName
      x-ui-tab: Advanced
      type: string
      description: Resolved display name for the selected server network interface; read-only.
    save_resume_data_interval:
      x-go-name: SaveResumeDataInterval
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -2147483648
      maximum: 2147483647
      description: Resume data save interval in minutes.
    save_statistics_interval:
      x-go-name: SaveStatisticsInterval
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -2147483648
      maximum: 2147483647
      description: Statistics save interval in minutes.
    torrent_file_size_limit:
      x-go-name: TorrentFileSizeLimit
      x-ui-tab: Advanced
      type: integer
      format: int64
      description: .torrent file size limit in bytes (the UI displays MiB).
    confirm_torrent_recheck:
      x-go-name: ConfirmTorrentRecheck
      x-ui-tab: Advanced
      type: boolean
      description: Ask for confirmation before rechecking a torrent.
    recheck_completed_torrents:
      x-go-name: RecheckCompletedTorrents
      x-ui-tab: Advanced
      type: boolean
      description: Recheck torrents after they finish downloading.
    app_instance_name:
      x-go-name: AppInstanceName
      x-ui-tab: Advanced
      type: string
      description: Application instance name shown by qBittorrent.
    refresh_interval:
      x-go-name: RefreshInterval
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -2147483648
      maximum: 2147483647
      description: Internal state refresh interval in milliseconds.
    resolve_peer_host_names:
      x-go-name: ResolvePeerHostNames
      x-ui-tab: Advanced
      type: boolean
      description: Resolve peer IP addresses to host names.
    resolve_peer_countries:
      x-go-name: ResolvePeerCountries
      x-ui-tab: Advanced
      type: boolean
      description: Resolve peer IP addresses to country names.
    confirm_remove_all_tags:
      x-go-name: ConfirmRemoveAllTags
      x-ui-tab: Advanced
      type: boolean
      description: Ask before removing all tags from torrents.
    confirm_remove_tracker_from_all_torrents:
      x-go-name: ConfirmRemoveTrackerFromAllTorrents
      x-ui-tab: Advanced
      type: boolean
      description: Ask before removing a tracker from all torrents.
    reannounce_when_address_changed:
      x-go-name: ReannounceWhenAddressChanged
      x-ui-tab: Advanced
      type: boolean
      description: Reannounce to trackers when the local IP address or port changes.
    enable_embedded_tracker:
      x-go-name: EnableEmbeddedTracker
      x-ui-tab: Advanced
      type: boolean
      description: Enable qBittorrent's embedded tracker.
    embedded_tracker_port:
      x-go-name: EmbeddedTrackerPort
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -2147483648
      maximum: 2147483647
      description: Port used by the embedded tracker.
    embedded_tracker_port_forwarding:
      x-go-name: EmbeddedTrackerPortForwarding
      x-ui-tab: Advanced
      type: boolean
      description: Enable port forwarding for the embedded tracker.
    mark_of_the_web:
      x-go-name: MarkOfTheWeb
      x-ui-tab: Advanced
      type: boolean
      description: Mark downloaded files with Mark-of-the-Web metadata where supported (macOS or Windows).
    ignore_ssl_errors:
      x-go-name: IgnoreSslErrors
      x-ui-tab: Advanced
      type: boolean
      description: Ignore SSL certificate errors; enabling this weakens TLS verification.
    python_executable_path:
      x-go-name: PythonExecutablePath
      x-ui-tab: Advanced
      type: string
      description: Server-side Python executable path; empty requests automatic detection. Changing this may require a qBittorrent restart.
    start_paused:
      x-go-name: StartPaused
      x-ui-tab: Advanced
      type: boolean
      description: Start the BitTorrent session in the paused state.
    shutdown_timeout:
      x-go-name: ShutdownTimeout
      x-ui-tab: Advanced
      type: integer
      format: int64
      minimum: -1
      maximum: 2147483647
      description: Session shutdown timeout in seconds; -1 means unlimited.
