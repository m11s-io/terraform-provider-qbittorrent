# The normal preferences response may expose only nonsecret WebUI fields.
# Password remains exclusively on the write patch model.
Read:
  type: object
  properties:
    web_ui_address: { type: string, x-go-name: WebUIAddress }
    web_ui_port: { type: integer, format: int32, x-go-name: WebUIPort }
    use_https: { type: boolean, x-go-name: UseHttps }
    web_ui_https_cert_path: { type: string, x-go-name: WebUIHttpsCertPath }
    web_ui_https_key_path: { type: string, x-go-name: WebUIHttpsKeyPath }
    web_ui_username: { type: string, x-go-name: WebUIUsername }
EndpointPatch:
  type: object
  properties:
    web_ui_address: { type: string, x-go-name: WebUIAddress }
    web_ui_port: { type: integer, format: int32, minimum: 1, maximum: 65535, x-go-name: WebUIPort }
    use_https: { type: boolean, x-go-name: UseHttps }
    web_ui_https_cert_path: { type: string, x-go-name: WebUIHttpsCertPath }
    web_ui_https_key_path: { type: string, x-go-name: WebUIHttpsKeyPath }
AuthPatch:
  type: object
  properties:
    web_ui_username: { type: string, minLength: 3, x-go-name: WebUIUsername }
    web_ui_password: { type: string, minLength: 6, writeOnly: true, x-go-name: WebUIPassword }
Patch:
  allOf:
    - $ref: '#/EndpointPatch'
    - $ref: '#/AuthPatch'
