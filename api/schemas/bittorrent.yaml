    max_active_uploads: {type: integer, format: int32}
    max_active_torrents: {type: integer, format: int32}
    dont_count_slow_torrents: {type: boolean}
    slow_torrent_dl_rate_threshold: {type: integer, format: int32}
    slow_torrent_ul_rate_threshold: {type: integer, format: int32}
    slow_torrent_inactive_timer: {type: integer, format: int32}
    max_ratio: {type: number, format: double}
    max_seeding_time: {type: integer, format: int32}
    max_inactive_seeding_time: {type: integer, format: int32}
    share_limits_mode: {type: string, enum: [MatchAny, MatchAll]}
    max_ratio_act: {type: integer, format: int32}
    add_trackers_enabled: {type: boolean}
