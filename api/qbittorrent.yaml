openapi: 3.2.1
info:
  title: qBittorrent provider API subset
  version: 2.16.2
  description: |
    Provider-specific subset of qBittorrent 5.3.0 (Web API 2.16.2), reviewed
    against release-5.3.0 commit 9213075dd5f7b352208361c6a84c1c115efc898e.
    This is not an official or complete upstream specification. Only nonsecret
    preferences managed by the provider are modeled; unknown response keys must
    be ignored. Reads use GET and mutations use form-encoded POST requests.
    The caller supplies Origin/Referer, authentication, bounded response reads
    and safe error handling. Cookie names have an instance-specific suffix.
  x-upstream-source: https://github.com/qbittorrent/qBittorrent/tree/9213075dd5f7b352208361c6a84c1c115efc898e/src/webui/api
servers:
  - url: /api/v2
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Application
  - name: Categories
  - name: WebUI
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Start a cookie session
      description: Credentials are form values. Successful login has an empty body, not legacy Ok. text.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Session established; Set-Cookie contains the session ID.
        '204':
          description: Session established; Set-Cookie contains the session ID.
        default:
          $ref: '#/components/responses/APIError'
  /app/version:
    get:
      operationId: getVersion
      tags: [Application]
      summary: Read the application version
      responses:
        '200':
          description: Application version, including the v prefix.
          content:
            text/plain:
              schema:
                type: string
                example: v5.3.0
        default:
          $ref: '#/components/responses/APIError'
  /app/webapiVersion:
    get:
      operationId: getWebAPIVersion
      tags: [Application]
      summary: Read the Web API version
      responses:
        '200':
          description: Web API version.
          content:
            text/plain:
              schema:
                type: string
                example: 2.16.2
        default:
          $ref: '#/components/responses/APIError'
  /app/preferences:
    get:
      operationId: getPreferences
      tags: [Application]
      summary: Read the supported nonsecret preferences
      description: The server returns additional keys, including secrets; these are deliberately not modeled.
      responses:
        '200':
          description: Application preferences (modeled subset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          $ref: '#/components/responses/APIError'
  /app/setPreferences:
    post:
      operationId: setPreferences
      tags: [Application]
      summary: Patch explicitly supplied preferences
      description: Missing JSON keys remain unchanged; false and zero are explicit updates.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [json]
              properties:
                json:
                  type: string
                  description: A JSON-encoded Preferences object, carried as a form string.
                  x-preferences-schema: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Preferences updated.
        '204':
          description: Preferences updated.
        default:
          $ref: '#/components/responses/APIError'
  /torrents/categories:
    get:
      operationId: getCategories
      tags: [Categories]
      summary: Read categories keyed by name
      responses:
        '200':
          description: Categories, including configured save paths.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Category'
        default:
          $ref: '#/components/responses/APIError'
  /torrents/createCategory:
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create a category
      description: Invalid or duplicate names return 409. Empty names return 400. Nested names can create ancestors.
      requestBody:
        $ref: '#/components/requestBodies/CategoryForm'
      responses:
        '200':
          description: Category created.
        '204':
          description: Category created.
        default:
          $ref: '#/components/responses/APIError'
  /torrents/editCategory:
    post:
      operationId: editCategory
      tags: [Categories]
      summary: Edit a category
      description: Missing categories return 404. Omitted savePath is unchanged; an empty string is an explicit path update.
      requestBody:
        $ref: '#/components/requestBodies/CategoryForm'
      responses:
        '200':
          description: Category updated.
        '204':
          description: Category updated.
        default:
          $ref: '#/components/responses/APIError'
  /torrents/removeCategories:
    post:
      operationId: removeCategories
      tags: [Categories]
      summary: Remove named categories and their descendants
      description: Missing categories are a successful no-op. Torrents are reassigned; automatic torrent management can relocate content.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: string
                  description: Newline-separated category names.
      responses:
        '200':
          description: Categories removed.
        '204':
          description: Categories removed.
        default:
          $ref: '#/components/responses/APIError'
  /clientdata/load:
    post:
      operationId: loadClientData
      tags: [WebUI]
      summary: Load WebUI client data
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: string
                  description: JSON array of selected qbt_-prefixed keys.
      responses:
        '200':
          description: Client data load succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUIPreferences'
        default:
          $ref: '#/components/responses/APIError'
  /clientdata/store:
    post:
      operationId: storeClientData
      tags: [WebUI]
      summary: Store WebUI client data
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: Partial JSON object of qbt_-prefixed WebUI values. Null removes a stored key.
      responses:
        '200':
          description: Client data store succeeded.
        '204':
          description: Client data stored.
        default:
          $ref: '#/components/responses/APIError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: QBT_SID_<instance>
      description: Placeholder cookie name; use a cookie jar to retain the actual server-issued name and attributes.
  responses:
    APIError:
      description: |
        Error status (400 parameters, 401 login/Host/CSRF, 403 session/ban,
        404 missing, 405 method, 409 conflict, 415 data, or server failure).
        Localized response bodies must not be exposed in diagnostics.
      content:
        text/plain:
          schema:
            type: string
  requestBodies:
    CategoryForm:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [category]
            properties:
              category:
                type: string
              savePath:
                type: string
                description: Empty paths use inherited category defaults; relative paths resolve under the global save path.
  schemas:
    Category:
      type: object
      required: [name, savePath]
      properties:
        name:
          type: string
        savePath:
          type: string
    Preferences:
      type: object
      description: |
        Allowlisted fields only. Unknown server fields (including credentials)
        are ignored, never captured in an additional-properties map. Every
        property is optional; absence must stay distinct from false or zero.
      properties:
        locale:
          type: string
          x-go-name: Locale
          x-ui-tab: Behavior
          description: "User interface language (upstream locale identifier)."
        confirm_torrent_deletion:
          type: boolean
          x-go-name: ConfirmTorrentDeletion
          x-ui-tab: Behavior
          description: "Confirm torrent deletion."
        status_bar_external_ip:
          type: boolean
          x-go-name: StatusBarExternalIP
          x-ui-tab: Behavior
          description: "Show external IP in the status bar."
        store_search_jobs:
          type: boolean
          x-go-name: StoreSearchJobs
          x-ui-tab: Behavior
          description: "Save search tabs."
        store_search_job_results:
          type: boolean
          x-go-name: StoreSearchJobResults
          x-ui-tab: Behavior
          description: "Save search results with search tabs."
        performance_warning:
          type: boolean
          x-go-name: PerformanceWarning
          x-ui-tab: Behavior
          description: "Log performance warnings."
        file_log_enabled:
          type: boolean
          x-go-name: FileLogEnabled
          x-ui-tab: Behavior
          description: "Enable file logging."
        file_log_path:
          type: string
          x-go-name: FileLogPath
          x-ui-tab: Behavior
          description: "Server log directory."
        file_log_backup_enabled:
          type: boolean
          x-go-name: FileLogBackupEnabled
          x-ui-tab: Behavior
          description: "Rotate log files by size."
        file_log_max_size:
          type: integer
          x-go-name: FileLogMaxSize
          x-ui-tab: Behavior
          description: "Log rotation size in KiB, 1..1024000."
          format: int64
          minimum: 1
          maximum: 1024000
        file_log_delete_old:
          type: boolean
          x-go-name: FileLogDeleteOld
          x-ui-tab: Behavior
          description: "Delete old backup logs."
        file_log_age:
          type: integer
          x-go-name: FileLogAge
          x-ui-tab: Behavior
          description: "Backup log retention count, 1..365."
          format: int64
          minimum: 1
          maximum: 365
        file_log_age_type:
          type: integer
          x-go-name: FileLogAgeType
          x-ui-tab: Behavior
          description: "Retention unit: 0 days, 1 months, 2 years."
          format: int64
          minimum: 0
          maximum: 2
        save_path:
          x-ui-tab: Downloads
          type: string
          x-go-name: SavePath
        temp_path:
          x-ui-tab: Downloads
          type: string
          x-go-name: TempPath
        temp_path_enabled:
          x-ui-tab: Downloads
          type: boolean
          x-go-name: TempPathEnabled
        auto_tmm_enabled:
          x-ui-tab: Downloads
          type: boolean
          x-go-name: AutoTMMEnabled
        dl_limit:
          x-ui-tab: Speed
          $ref: '#/components/schemas/DownloadLimit'
        up_limit:
          x-ui-tab: Speed
          $ref: '#/components/schemas/UploadLimit'
        alt_dl_limit:
          x-ui-tab: Speed
          $ref: '#/components/schemas/AltDownloadLimit'
        alt_up_limit:
          x-ui-tab: Speed
          $ref: '#/components/schemas/AltUploadLimit'
        scheduler_enabled:
          x-ui-tab: Speed
          type: boolean
          x-go-name: SchedulerEnabled
          description: Schedule alternative rate limits using the server local time.
        schedule_from_hour:
          x-ui-tab: Speed
          type: integer
          x-go-name: ScheduleFromHour
          description: Start hour; must be supplied together with schedule_from_min.
          format: int64
          minimum: 0
          maximum: 23
        schedule_from_min:
          x-ui-tab: Speed
          type: integer
          x-go-name: ScheduleFromMin
          description: Start minute; must be supplied together with schedule_from_hour.
          format: int64
          minimum: 0
          maximum: 59
        schedule_to_hour:
          x-ui-tab: Speed
          type: integer
          x-go-name: ScheduleToHour
          description: End hour; must be supplied together with schedule_to_min.
          format: int64
          minimum: 0
          maximum: 23
        schedule_to_min:
          x-ui-tab: Speed
          type: integer
          x-go-name: ScheduleToMin
          description: End minute; must be supplied together with schedule_to_hour.
          format: int64
          minimum: 0
          maximum: 59
        scheduler_days:
          x-ui-tab: Speed
          type: integer
          x-go-name: SchedulerDays
          description: 0 every day, 1 weekdays, 2 weekends, 3 Monday, 4 Tuesday, 5 Wednesday, 6 Thursday, 7 Friday, 8 Saturday, 9 Sunday.
          format: int64
          minimum: 0
          maximum: 9
        limit_utp_rate:
          x-ui-tab: Speed
          type: boolean
          x-go-name: LimitUTPRate
          description: Apply rate limits to the uTP protocol.
        limit_tcp_overhead:
          x-ui-tab: Speed
          type: boolean
          x-go-name: LimitTCPOverhead
          description: Apply rate limits to transport overhead.
        limit_lan_peers:
          x-ui-tab: Speed
          type: boolean
          x-go-name: LimitLANPeers
          description: Apply rate limits to peers on the LAN.
        dht:
          x-ui-tab: BitTorrent
          type: boolean
          x-go-name: DHT
        pex:
          x-ui-tab: BitTorrent
          type: boolean
          x-go-name: PeX
        lsd:
          x-ui-tab: BitTorrent
          type: boolean
          x-go-name: LSD
        listen_port:
          x-ui-tab: Connection
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
          x-go-name: ListenPort
        upnp:
          x-ui-tab: Connection
          type: boolean
          x-go-name: UPnP
    DownloadLimit:
      type: integer
      format: int64
      description: Bytes/second; 0 is unlimited. The server quantizes to multiples of 1024; provider maximum is 2147482624.
      x-go-name: DownloadLimit
    UploadLimit:
      type: integer
      format: int64
      description: Bytes/second; 0 is unlimited. The server quantizes to multiples of 1024; provider maximum is 2147482624.
      x-go-name: UploadLimit
    AltDownloadLimit:
      type: integer
      format: int64
      description: Alternate download bytes/second; 0 is unlimited. The server quantizes to multiples of 1024.
      x-go-name: AltDownloadLimit
    AltUploadLimit:
      type: integer
      format: int64
      description: Alternate upload bytes/second; 0 is unlimited. The server quantizes to multiples of 1024.
      x-go-name: AltUploadLimit
    WebUIPreferences:
      type: object
      description: Allowlisted server-stored WebUI Behavior settings; unknown keys are discarded.
      properties:
        qbt_date_format:
          type: string
          x-go-name: DateFormat
          x-ui-tab: Behavior
        qbt_color_scheme:
          type: string
          x-go-name: ColorScheme
          x-ui-tab: Behavior
        qbt_display_density:
          type: string
          x-go-name: DisplayDensity
          x-ui-tab: Behavior
        qbt_use_alt_row_colors:
          type: boolean
          x-go-name: UseAltRowColors
          x-ui-tab: Behavior
        qbt_dblclick_download:
          type: string
          x-go-name: DblclickDownload
          x-ui-tab: Behavior
        qbt_dblclick_complete:
          type: string
          x-go-name: DblclickComplete
          x-ui-tab: Behavior
        qbt_dblclick_filter:
          type: string
          x-go-name: DblclickFilter
          x-ui-tab: Behavior
        qbt_hide_zero_status_filters:
          type: boolean
          x-go-name: HideZeroStatusFilters
          x-ui-tab: Behavior
        qbt_add_new_torrent_dialog_enabled:
          type: boolean
          x-go-name: AddNewTorrentDialogEnabled
          x-ui-tab: Behavior
        qbt_full_url_tracker_column:
          type: boolean
          x-go-name: FullURLTrackerColumn
          x-ui-tab: Behavior
        qbt_use_virtual_list:
          type: boolean
          x-go-name: UseVirtualList
          x-ui-tab: Behavior
